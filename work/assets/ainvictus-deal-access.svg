<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AInvictus Deal Desk gated buyer access flow</title>
  <desc id="desc">A prospective buyer is screened, signs an NDA and then receives controlled tokenized access to the deal room.</desc>
  <rect width="1600" height="900" fill="#e9edf2"/>
  <text x="76" y="91" fill="#0a286b" font-family="Arial, sans-serif" font-weight="700" font-size="25">AINVICTUS DEAL DESK</text>
  <text x="1524" y="87" fill="#52627a" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" text-anchor="end">BUILT AND TESTED · PRODUCT FLOW DIAGRAM</text>
  <text x="76" y="198" fill="#111a2e" font-family="Arial, sans-serif" font-weight="700" font-size="59">Control who reaches</text>
  <text x="76" y="259" fill="#b88400" font-family="Arial, sans-serif" font-weight="700" font-size="59">the confidential room.</text>
  <text x="76" y="314" fill="#526079" font-family="Arial, sans-serif" font-size="21">Screening and NDA approval happen before controlled document access.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(76 390)"><rect width="330" height="224" rx="10" fill="#fff" stroke="#c4ceda"/><text x="28" y="44" fill="#6c7c93" font-size="13" letter-spacing="1.5">01 · INTEREST</text><text x="28" y="98" fill="#0a286b" font-size="24" font-weight="700">Buyer screening</text><text x="28" y="144" fill="#53637b" font-size="16">Identity, fit and qualification</text><text x="28" y="172" fill="#53637b" font-size="16">enter a reviewable record.</text></g>
    <path d="M427 502h55m-10-10 10 10-10 10" fill="none" stroke="#b88400" stroke-width="3"/>
    <g transform="translate(503 390)"><rect width="330" height="224" rx="10" fill="#fff" stroke="#c4ceda"/><text x="28" y="44" fill="#6c7c93" font-size="13" letter-spacing="1.5">02 · APPROVAL</text><text x="28" y="98" fill="#0a286b" font-size="24" font-weight="700">NDA gate</text><text x="28" y="144" fill="#53637b" font-size="16">The buyer accepts the terms</text><text x="28" y="172" fill="#53637b" font-size="16">before access is issued.</text></g>
    <path d="M854 502h55m-10-10 10 10-10 10" fill="none" stroke="#b88400" stroke-width="3"/>
    <g transform="translate(930 390)"><rect width="330" height="224" rx="10" fill="#fff" stroke="#c4ceda"/><text x="28" y="44" fill="#6c7c93" font-size="13" letter-spacing="1.5">03 · ACCESS</text><text x="28" y="98" fill="#0a286b" font-size="24" font-weight="700">Tokenized room</text><text x="28" y="144" fill="#53637b" font-size="16">Controlled access opens only</text><text x="28" y="172" fill="#53637b" font-size="16">for the approved buyer.</text></g>
    <path d="M1281 502h55m-10-10 10 10-10 10" fill="none" stroke="#b88400" stroke-width="3"/>
    <g transform="translate(1357 390)"><rect width="167" height="224" rx="10" fill="#071c4d"/><text x="22" y="44" fill="#94add6" font-size="13" letter-spacing="1.3">04 · TRACE</text><text x="22" y="98" fill="#fff" font-size="22" font-weight="700">Access</text><text x="22" y="128" fill="#fff" font-size="22" font-weight="700">history</text><text x="22" y="176" fill="#c7d2e4" font-size="15">A reviewable</text><text x="22" y="201" fill="#c7d2e4" font-size="15">record remains.</text></g>
  </g>
  <rect x="76" y="704" width="1448" height="94" rx="10" fill="#fff4ca"/>
  <text x="108" y="744" fill="#5c4300" font-family="Arial, sans-serif" font-size="17" font-weight="700">SOURCE-VERIFIED PRODUCT STRUCTURE</text>
  <text x="108" y="775" fill="#5c4300" font-family="Arial, sans-serif" font-size="17">Shown with fixed sample concepts so buyer and deal data remain private</text>
</svg>
