<svg xmlns="http://www.w3.org/2000/svg" width="880" height="701" viewBox="0 0 880 701" role="img" aria-labelledby="title description">
  <title id="title">Sanitized Slack delivery from the B2B Languages audio placement workflow</title>
  <desc id="description">A privacy-safe reconstruction of an automated placement-test result. It shows multiple-choice scoring, two transcribed audio responses, an assessment summary, an estimated level and teacher review status. All identity and contact fields are hidden.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#16243a" flood-opacity=".12"/>
    </filter>
    <linearGradient id="banner" x1="0" x2="1">
      <stop stop-color="#173d70"/>
      <stop offset="1" stop-color="#245fa4"/>
    </linearGradient>
  </defs>

  <rect width="880" height="701" fill="#eef2f7"/>
  <rect x="28" y="25" width="824" height="651" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="28" y="25" width="824" height="72" rx="28" fill="url(#banner)"/>
  <rect x="28" y="69" width="824" height="28" fill="url(#banner)"/>
  <circle cx="72" cy="61" r="17" fill="#ffffff" opacity=".96"/>
  <path d="M64 61h16M72 53v16" stroke="#173d70" stroke-width="3" stroke-linecap="round"/>
  <text x="101" y="58" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">B2B Languages workflow</text>
  <text x="101" y="80" fill="#dcecff" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing=".5">SANITIZED RECONSTRUCTION OF AN ACTUAL SLACK RESULT</text>

  <circle cx="77" cy="143" r="24" fill="#111827"/>
  <circle cx="77" cy="135" r="8" fill="#ffffff" opacity=".94"/>
  <path d="M61 158c3-10 29-10 32 0" fill="#ffffff" opacity=".94"/>
  <text x="117" y="137" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">n8n-self-host</text>
  <rect x="244" y="119" width="39" height="24" rx="6" fill="#e8eaee"/>
  <text x="252" y="136" fill="#5d6470" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">APP</text>
  <text x="296" y="137" fill="#747c89" font-family="Inter, Arial, sans-serif" font-size="13">15:12</text>

  <text x="117" y="178" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750">New Audio Placement Test Result</text>

  <rect x="117" y="199" width="683" height="61" rx="12" fill="#f7f8fa" stroke="#e2e6ec"/>
  <text x="137" y="222" fill="#687181" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">IDENTITY AND CONTACT DETAILS</text>
  <rect x="137" y="234" width="127" height="10" rx="5" fill="#cfd5de"/>
  <rect x="280" y="234" width="157" height="10" rx="5" fill="#cfd5de"/>
  <rect x="453" y="234" width="189" height="10" rx="5" fill="#cfd5de"/>
  <rect x="658" y="234" width="121" height="10" rx="5" fill="#cfd5de"/>

  <rect x="117" y="281" width="330" height="128" rx="16" fill="#f8fbff" stroke="#d4e4f5"/>
  <text x="139" y="311" fill="#173d70" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing=".9">MULTIPLE-CHOICE SCORING</text>
  <text x="139" y="343" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750">Band breakdown calculated</text>
  <circle cx="414" cy="309" r="12" fill="#2f9e63"/>
  <path d="m408 309 4 4 7-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="139" y="374" fill="#687181" font-family="Inter, Arial, sans-serif" font-size="14">Task-level results retained for review</text>
  <text x="139" y="395" fill="#687181" font-family="Inter, Arial, sans-serif" font-size="14">Personal scores hidden in this portfolio</text>

  <rect x="470" y="281" width="330" height="128" rx="16" fill="#fffaf2" stroke="#ead9ba"/>
  <text x="492" y="311" fill="#7d5314" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing=".9">OPEN-TASK SCORING</text>
  <text x="492" y="343" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750">2 audio responses</text>
  <text x="492" y="370" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">transcribed and assessed</text>
  <text x="492" y="395" fill="#687181" font-family="Inter, Arial, sans-serif" font-size="14">Writing and speech evaluated separately</text>

  <rect x="117" y="431" width="683" height="106" rx="16" fill="#f7f8fa" stroke="#e2e6ec"/>
  <text x="139" y="461" fill="#687181" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing=".9">ASSESSMENT SUMMARY</text>
  <text x="139" y="490" fill="#303949" font-family="Inter, Arial, sans-serif" font-size="15">Spoken answers are transcribed and summarized with the written tasks.</text>
  <text x="139" y="514" fill="#303949" font-family="Inter, Arial, sans-serif" font-size="15">The result is prepared for a teacher to review before placement.</text>

  <rect x="117" y="559" width="442" height="72" rx="16" fill="#173d70"/>
  <text x="139" y="586" fill="#bbd7f5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1">FINAL RESULT</text>
  <text x="139" y="614" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">Estimated level prepared</text>
  <rect x="580" y="559" width="220" height="72" rx="16" fill="#eaf6ef" stroke="#c7e7d3"/>
  <text x="602" y="586" fill="#23754a" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1">HUMAN CHECK</text>
  <text x="602" y="614" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750">Teacher review required</text>

  <text x="117" y="654" fill="#7c8491" font-family="Inter, Arial, sans-serif" font-size="12">Automated through n8n and delivered in Slack. No student data shown.</text>
</svg>
