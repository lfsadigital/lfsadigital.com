<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AInvictus AI Receptionist verified product flow</title>
  <desc id="desc">An inbound call is answered, qualified, booked through the configured scheduling connector, recorded and routed for human review when needed.</desc>
  <rect width="1600" height="900" fill="#e9edf2"/>
  <text x="76" y="91" fill="#0a286b" font-family="Arial, sans-serif" font-weight="700" font-size="25">AINVICTUS × LFSA</text>
  <text x="1524" y="87" fill="#52627a" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" text-anchor="end">VERIFIED PRODUCT FLOW · DIAGRAM</text>
  <text x="76" y="198" fill="#111a2e" font-family="Arial, sans-serif" font-weight="700" font-size="59">Answer the call. Put the job</text>
  <text x="76" y="259" fill="#b88400" font-family="Arial, sans-serif" font-weight="700" font-size="59">in the right system.</text>
  <text x="76" y="314" fill="#526079" font-family="Arial, sans-serif" font-size="21">One scheduling connector is selected per client: Google Calendar or Jobber.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(76 390)"><rect width="310" height="206" rx="10" fill="#fff" stroke="#c4ceda"/><text x="26" y="42" fill="#6c7c93" font-size="13" letter-spacing="1.5">01 · RECEIVE</text><text x="26" y="96" fill="#0a286b" font-size="23" font-weight="700">Inbound call</text><text x="26" y="140" fill="#53637b" font-size="16">The assistant answers and</text><text x="26" y="168" fill="#53637b" font-size="16">identifies itself.</text></g>
    <path d="M410 493h28m-9-9 9 9-9 9" fill="none" stroke="#b88400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(456 390)"><rect width="310" height="206" rx="10" fill="#fff" stroke="#c4ceda"/><text x="26" y="42" fill="#6c7c93" font-size="13" letter-spacing="1.5">02 · QUALIFY</text><text x="26" y="96" fill="#0a286b" font-size="23" font-weight="700">Understand the need</text><text x="26" y="140" fill="#53637b" font-size="16">Service, urgency and contact</text><text x="26" y="168" fill="#53637b" font-size="16">details become structured data.</text></g>
    <path d="M790 493h28m-9-9 9 9-9 9" fill="none" stroke="#b88400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(836 390)"><rect width="310" height="206" rx="10" fill="#fff" stroke="#c4ceda"/><text x="26" y="42" fill="#6c7c93" font-size="13" letter-spacing="1.5">03 · BOOK OR TRANSFER</text><text x="26" y="96" fill="#0a286b" font-size="23" font-weight="700">Use the chosen system</text><text x="26" y="140" fill="#53637b" font-size="16">Check availability and create</text><text x="26" y="168" fill="#53637b" font-size="16">the request, or hand off.</text></g>
    <path d="M1170 493h28m-9-9 9 9-9 9" fill="none" stroke="#b88400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1216 390)"><rect width="308" height="206" rx="10" fill="#071c4d"/><text x="26" y="42" fill="#94add6" font-size="13" letter-spacing="1.5">04 · REVIEW</text><text x="26" y="96" fill="#fff" font-size="23" font-weight="700">Record the outcome</text><text x="26" y="140" fill="#c7d2e4" font-size="16">Call, outcome and booking are</text><text x="26" y="168" fill="#c7d2e4" font-size="16">available to the operator.</text></g>
  </g>
  <rect x="76" y="704" width="1448" height="94" rx="10" fill="#fff4ca"/>
  <text x="108" y="744" fill="#5c4300" font-family="Arial, sans-serif" font-size="17" font-weight="700">HUMAN BOUNDARY</text>
  <text x="108" y="775" fill="#5c4300" font-family="Arial, sans-serif" font-size="17">Urgent, uncertain or transfer-ready calls can leave the automated path for a person.</text>
</svg>
