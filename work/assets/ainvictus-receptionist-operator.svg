<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AInvictus AI Receptionist operator interface map</title>
  <desc id="desc">A diagram of the records an operator can inspect: calls, outcomes, appointments or leads, connector state and human handoff.</desc>
  <rect width="1600" height="900" fill="#0a0e1a"/>
  <text x="76" y="91" fill="#c9a24e" font-family="Arial, sans-serif" font-weight="700" font-size="25">AINVICTUS × OPERATOR VIEW</text>
  <text x="1524" y="87" fill="#8d97aa" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" text-anchor="end">REVIEWABLE OPERATOR HANDOFF</text>
  <text x="76" y="198" fill="#e9eaee" font-family="Arial, sans-serif" font-weight="700" font-size="59">The call leaves a record</text>
  <text x="76" y="259" fill="#c9a24e" font-family="Arial, sans-serif" font-weight="700" font-size="59">a person can inspect.</text>
  <text x="76" y="314" fill="#aab1bf" font-family="Arial, sans-serif" font-size="21">A privacy-safe product map of the records available after each call.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(76 395)"><rect width="342" height="210" rx="12" fill="#12172a" stroke="#30384d"/><text x="28" y="48" fill="#c9a24e" font-size="14" letter-spacing="1.5">CALL RECORD</text><text x="28" y="101" fill="#e9eaee" font-size="25" font-weight="700">What happened</text><text x="28" y="145" fill="#aab1bf" font-size="17">Transcript or recording</text><text x="28" y="176" fill="#aab1bf" font-size="17">Outcome and duration</text></g>
    <g transform="translate(447 395)"><rect width="342" height="210" rx="12" fill="#12172a" stroke="#30384d"/><text x="28" y="48" fill="#c9a24e" font-size="14" letter-spacing="1.5">OPERATING RESULT</text><text x="28" y="101" fill="#e9eaee" font-size="25" font-weight="700">What was created</text><text x="28" y="145" fill="#aab1bf" font-size="17">Appointment or lead</text><text x="28" y="176" fill="#aab1bf" font-size="17">Selected scheduling system</text></g>
    <g transform="translate(818 395)"><rect width="342" height="210" rx="12" fill="#12172a" stroke="#30384d"/><text x="28" y="48" fill="#c9a24e" font-size="14" letter-spacing="1.5">CONNECTOR STATE</text><text x="28" y="101" fill="#e9eaee" font-size="25" font-weight="700">Where it went</text><text x="28" y="145" fill="#aab1bf" font-size="17">Google Calendar or Jobber</text><text x="28" y="176" fill="#aab1bf" font-size="17">One connector per client</text></g>
    <g transform="translate(1189 395)"><rect width="335" height="210" rx="12" fill="#161b2e" stroke="#c9a24e"/><text x="28" y="48" fill="#c9a24e" font-size="14" letter-spacing="1.5">HUMAN HANDOFF</text><text x="28" y="101" fill="#e9eaee" font-size="25" font-weight="700">What needs review</text><text x="28" y="145" fill="#aab1bf" font-size="17">Transfer or exception</text><text x="28" y="176" fill="#aab1bf" font-size="17">Operator follows up</text></g>
  </g>
  <line x1="76" y1="742" x2="1524" y2="742" stroke="#30384d"/>
  <text x="76" y="792" fill="#aab1bf" font-family="Arial, sans-serif" font-size="17">Inspectable product records · human fallback retained</text>
</svg>
